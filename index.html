<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Central</title><style>body{margin:0;background:#0c1511;color:#edf7f0;font:15px system-ui}main{max-width:1120px;margin:auto;padding:28px}.card{background:#17221d;border:1px solid #294535;border-radius:14px;padding:20px;margin:16px 0}input,select,button{box-sizing:border-box;padding:10px;margin:4px;width:100%;border-radius:7px;border:1px solid #3c5b49;background:#101b15;color:#fff}button{background:#21cf70;color:#062a14;font-weight:700;cursor:pointer}.warn{background:#ffd363}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #294535;text-align:left;vertical-align:top}.muted{color:#a9bbb0}@media(min-width:700px){.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}}</style><main><h1>Control Central</h1><p id="identity" class="muted">Cargando…</p><section class="card" id="login"><h2>Acceso del dueño</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button onclick="signIn()">Ingresar</button><p id="loginMessage"></p></section><section id="panel" hidden><div class="card"><h2>Nueva empresa cliente</h2><p class="muted">Crea empresa, licencia y su único coordinador inicial.</p><div class="grid"><input id="companyName" placeholder="Empresa"><input id="contactName" placeholder="Responsable"><select id="plan"><option value="basico">Básico</option><option value="profesional">Profesional</option></select><input id="adminName" placeholder="Coordinador"><input id="adminEmail" type="email" placeholder="Correo coordinador"><input id="adminPassword" type="password" placeholder="Contraseña temporal (10+)"><input id="userLimit" type="number" value="3" min="1"></div><button onclick="provision()">Crear empresa y coordinador</button><p id="message"></p></div><div class="card"><h2>Empresas y mensualidades</h2><p class="muted">Suspender bloquea los próximos accesos de la empresa.</p><div id="companies">Cargando…</div></div><div class="card"><h2>Usuarios</h2><div id="users">Cargando…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function getSession(){return (await sb.auth.getSession()).data.session}async function start(){const c=await fetch('/.netlify/functions/public-config').then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);identity.textContent='Inicia sesión como Super Admin.';boot()}async function signIn(){const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});loginMessage.textContent=error?.message||'';if(!error)boot()}async function boot(){const s=await getSession();if(!s)return;identity.textContent='Super Admin: '+s.user.email;login.hidden=true;panel.hidden=false;const {data:c,error}=await sb.from('companies').select('*').order('created_at',{ascending:false});companies.innerHTML=error?error.message:`<table><tr><th>Empresa</th><th>Plan/cupos</th><th>Estado</th><th>Licencia</th><th></th></tr>${c.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.contact_email||'')}</small></td><td><select id="p-${x.id}"><option value="basico" ${x.plan==='basico'?'selected':''}>Básico</option><option value="profesional" ${x.plan==='profesional'?'selected':''}>Profesional</option></select><input id="l-${x.id}" type="number" min="1" value="${x.user_limit}"></td><td><select id="s-${x.id}">${['activa','suspendida','vencida'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><code>${esc(x.license_key)}</code></td><td><button class="warn" onclick="saveCompany('${x.id}')">Guardar</button></td></tr>`).join('')}</table>`;const u=await fetch('/.netlify/functions/company-users',{headers:{Authorization:'Bearer '+s.access_token}}).then(r=>r.json());users.innerHTML=Array.isArray(u)?`<table><tr><th>Empresa</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr>${u.map(x=>`<tr><td>${esc(x.companyName)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${x.active?'Activo':'Desactivado'}</td></tr>`).join('')}</table>`:(u.error||'No fue posible cargar.') }async function provision(){const s=await getSession(),r=await fetch('/.netlify/functions/provision-company',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({companyName:companyName.value,contactName:contactName.value,plan:plan.value,userLimit:userLimit.value,adminName:adminName.value,adminEmail:adminEmail.value,adminPassword:adminPassword.value})}),d=await r.json();message.textContent=r.ok?`Empresa creada. Licencia: ${d.company.license_key}`:d.error;if(r.ok)boot()}async function saveCompany(id){const s=await getSession(),r=await fetch('/.netlify/functions/company-control',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({id,status:document.getElementById('s-'+id).value,plan:document.getElementById('p-'+id).value,userLimit:document.getElementById('l-'+id).value})}),d=await r.json();if(!r.ok)alert(d.error);else boot()}start().catch(()=>identity.textContent='No fue posible cargar configuración segura.')</script>
