<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Central · Mesa de Ayuda</title><style>body{margin:0;background:#0c1511;color:#edf7f0;font:16px system-ui}main{max-width:1050px;margin:auto;padding:32px}.card{background:#17221d;border:1px solid #294535;border-radius:14px;padding:22px;margin:18px 0}input,select,button{box-sizing:border-box;padding:10px;margin:5px;width:100%;border-radius:7px;border:1px solid #3c5b49;background:#101b15;color:white}button{background:#21cf70;color:#062a14;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #294535;text-align:left}@media(min-width:700px){.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}}</style></head><body><main><h1>Control Central</h1><p id="identity">Inicia sesión como Super Admin.</p><div class="card" id="login"><h2>Acceso dueño</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button onclick="signIn()">Ingresar</button><p id="loginMessage"></p></div><div id="panel" hidden><div class="card"><h2>Nueva empresa cliente</h2><div class="grid"><input id="companyName" placeholder="Empresa"><input id="contactName" placeholder="Responsable"><select id="plan"><option value="basico">Básico</option><option value="profesional">Profesional</option></select><input id="adminName" placeholder="Administrador"><input id="adminEmail" type="email" placeholder="Correo administrador"><input id="adminPassword" type="password" placeholder="Contraseña temporal (10+)" ><input id="userLimit" type="number" value="3" min="1"></div><button onclick="provision()">Crear empresa y administrador</button><p id="message"></p></div><div class="card"><h2>Empresas</h2><div id="companies">Cargando…</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey);async function signIn(){const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});loginMessage.textContent=error?.message||'';if(!error)boot()}async function boot(){const{data:{user}}=await sb.auth.getUser();if(!user)return;identity.textContent='Super Admin: '+user.email;login.hidden=true;panel.hidden=false;const{data,error}=await sb.from('companies').select('*').order('created_at',{ascending:false});companies.innerHTML=error?error.message:`<table><tr><th>Empresa</th><th>Plan</th><th>Estado</th><th>Licencia</th></tr>${data.map(c=>`<tr><td>${c.name}</td><td>${c.plan}</td><td>${c.status}</td><td>${c.license_key}</td></tr>`).join('')}</table>`}async function provision(){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/.netlify/functions/provision-company',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({companyName:companyName.value,contactName:contactName.value,plan:plan.value,userLimit:userLimit.value,adminName:adminName.value,adminEmail:adminEmail.value,adminPassword:adminPassword.value})}),d=await r.json();message.textContent=r.ok?`Empresa creada. Licencia: ${d.company.license_key}`:d.error;if(r.ok)boot()}boot()</script></body></html>
